<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .Index {
            background: linear-gradient(to right, #463F3A, #8A817c);
        }

        .contact-info {

            width: 300px;
            padding: 20px;
            text-align: left;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            transition: all 0.35s ease;

        }
    </style>

</head>

<body>

    <div style="display: flex; align-items: center; justify-content: space-between;  padding: 20px;" class="Index">
        <h1 style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-size: 45px;">Vendra
        </h1>
        <div style="font-family: Arial, Helvetica, sans-serif;">
            <a href="Index.html" style="text-decoration: none; color: black;">Home</a>
            <a href="allproducts.html" style="margin-left: 22px; text-decoration: none; color: black;">Product</a>
            <a href="contactpage.html" style="margin-left: 22px; text-decoration: none; color: black;">Contact</a>
        </div>
    </div>
    <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 50px; text-align: center; padding: 10px;  ">
        <h1>Contact Us</h1>
        <h4>Have questions or feedback? We'd love to hear from you!</h4>
    </div>

    <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 25px; text-align: center; padding: 50px; display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));; text-align: center; padding: 30px 15px; font-family: Arial, Helvetica, sans-serif;  justify-content: center; gap: 20px;"
        class="products-grid">
        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 50px; text-align: center; padding: 50px;"
            class="contact-info">
            <h3>Email: fareedgobir@gmail.com</h3>
        </div>

        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 50px; text-align: center; padding: 50px;"
            class="contact-info"> 
            <h3>Phone: 123-456-7890</h3>
        </div>

        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 50px; text-align: center; padding: 50px;"
            class="contact-info">
            <h3>Location: 123 Main Street, City, State 12345</h3>
        </div>

    </div>
    <div style=" padding: 30px; border-radius: 20px; justify-content: center; justify-self: center;" class="contact-info">
        <h1 style="font-family: Arial, Helvetica, sans-serif;">Send us a Message</h1>
        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 20px; text-align: center; padding: 2px;  ">


            <input type="text" id="Name" required placeholder=" Enter your name"
                style="padding: 10px 20px; border-radius: 35px; outline: none;">


        </div>

        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 20px; text-align: center;  padding: 2px;">


            <input type="text" id="Gmail" required placeholder=" Enter your gmail"
                style="padding: 10px 20px; border-radius: 35px; outline: none;">

        </div>

        <div style="font-family: Arial, Helvetica, sans-serif; margin-top: 20px; text-align: center;  padding: 2px; ">

            <input type="text" id="Subject" required placeholder=" Enter your subject"
                style="padding: 10px 20px; border-radius: 35px; outline: none;">


        </div>

        <div style="align-items: center; border-radius: 15px;  display: flex; justify-content: center;">
            <button type="submit"
                style="width: 300px; height: 50px; margin-top: 20px; border-radius: 50px; background-color: blueviolet; color: white; align-self: center; align-items: center; text-align: center;">Submit</button>
        </div>


    </div>




</body>
